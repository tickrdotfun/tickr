[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
gas_limit = "3000000000"
fs_permissions = [{ access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }, { access = "read", path = "./config" }]
# PositionManager (Uniswap periphery) is only compiled for local tests; on chain we use the canonical deployment.
code_size_limit = 400000

[profile.default.fuzz]
runs = 256

# continuous integration runs the fuzz suites deeper: FOUNDRY_PROFILE=ci
[profile.ci.fuzz]
runs = 1000

[profile.fork]
eth_rpc_url = "https://rpc.mainnet.chain.robinhood.com"

[rpc_endpoints]
robinhood = "https://rpc.mainnet.chain.robinhood.com"

# Blockscout verification: pass --verifier blockscout --verifier-url https://robinhoodchain.blockscout.com/api explicitly.

[lint]
lint_on_build = false
